name: Mandi Rates Sync

on:
  schedule:
    - cron: '30 5 * * *'   # रोज IST 11:00 AM
    - cron: '30 8 * * *'   # रोज IST 2:00 PM
    - cron: '30 11 * * *'  # रोज IST 5:00 PM
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # JSON commit saathi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Node version
        run: node --version

      - name: Install dependencies
        run: npm install

      - name: Run Mandi Sync
        run: node msamb_scraper.js

      - name: Check file changes
        run: |
          echo "📊 Checking mandi_latest.json status..."
          ls -lh mandi_latest.json
          echo ""
          echo "Git status:"
          git status mandi_latest.json
          echo ""
          echo "File diff (first 20 lines):"
          git diff mandi_latest.json | head -20 || echo "No diff to show"

      - name: Commit and push mandi_latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_latest.json
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "ℹ️ No changes in mandi_latest.json - skipping commit"
          else
            echo "✅ Changes detected - committing..."
            git commit -m "chore: update mandi_latest.json [$(date +%Y-%m-%d)]"
            git push origin main
            echo "✅ Successfully pushed to GitHub"
          fi
