name: Mandi Rates Sync

on:
  schedule:
    - cron: '30 5 * * *'   # रोज IST 11:00 AM
    - cron: '30 8 * * *'   # रोज IST 2:00 PM
    - cron: '30 11 * * *'  # रोज IST 5:00 PM
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # JSON commit saathi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Node version
        run: node --version

      - name: Install dependencies
        run: npm install

      - name: Run Mandi Sync
        run: node msamb_scraper.js

      - name: Commit mandi_latest.json to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mandi_latest.json
          git diff --staged --quiet || git commit -m "chore: update mandi_latest.json [$(date +%Y-%m-%d)]"
          git push
