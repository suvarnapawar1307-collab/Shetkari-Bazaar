name: Government Schemes Sync

on:
  schedule:
    - cron: '0 2 * * *'   # रोज IST 7:30 AM (Daily at 2:00 AM UTC)
  workflow_dispatch:      # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # JSON commit साठी
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Node version
        run: node --version

      - name: Install dependencies
        run: npm install

      - name: Fetch Government Schemes
        run: node schemes_scraper.js

      - name: Commit schemes_latest.json to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schemes_latest.json
          git diff --staged --quiet || git commit -m "chore: update schemes_latest.json [$(date +%Y-%m-%d)]"
          git push
